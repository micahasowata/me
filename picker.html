<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>micahasowata::picker</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                /* Catppuccin Latte */
                --base: #eff1f5;
                --mantle: #e6e9ef;
                --surface0: #ccd0da;
                --surface1: #bcc0cc;
                --text: #4c4f69;
                --sub: #6c6f85;
                --mauve: #8839ef;
                --lavender: #7287fd;
                --red: #d20f39;
                --green: #40a02b;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    /* Catppuccin Mocha */
                    --base: #1e1e2e;
                    --mantle: #181825;
                    --surface0: #313244;
                    --surface1: #45475a;
                    --text: #cdd6f4;
                    --sub: #a6adc8;
                    --mauve: #cba6f7;
                    --lavender: #b4befe;
                    --red: #f38ba8;
                    --green: #a6e3a1;
                    color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --base: #1e1e2e;
                --mantle: #181825;
                --surface0: #313244;
                --surface1: #45475a;
                --text: #cdd6f4;
                --sub: #a6adc8;
                --mauve: #cba6f7;
                --lavender: #b4befe;
                --red: #f38ba8;
                --green: #a6e3a1;
                color-scheme: dark;
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--base);
                color: var(--text);
                font-family: Nunito, system-ui, sans-serif;
                line-height: 1.5;
                min-height: 100vh;
            }
            main {
                max-width: 720px;
                margin: 0 auto;
                padding: 40px 20px 64px;
            }
            h1 {
                font-size: 2rem;
                font-weight: 800;
                margin: 0 0 6px;
                color: var(--mauve);
                letter-spacing: -0.01em;
            }
            p.lead {
                margin: 0 0 28px;
                color: var(--sub);
            }
            .panel {
                background: var(--mantle);
                border: 1px solid var(--surface0);
                border-radius: 16px;
                padding: 20px;
            }
            .row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
            label {
                display: block;
                font-weight: 700;
                font-size: 0.9rem;
                margin-bottom: 6px;
            }
            input[type="number"] {
                width: 100%;
                font:
                    600 1.1rem "JetBrains Mono",
                    monospace;
                color: var(--text);
                background: var(--base);
                border: 2px solid var(--surface0);
                border-radius: 10px;
                padding: 10px 12px;
            }
            input[type="number"]:focus {
                outline: none;
                border-color: var(--lavender);
            }

            /* option groups (parity + portion) */
            fieldset {
                border: 0;
                margin: 18px 0 0;
                padding: 0;
                min-width: 0;
            }
            legend {
                font-weight: 700;
                font-size: 0.9rem;
                padding: 0;
                margin-bottom: 6px;
            }
            .pills {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .pill {
                position: relative;
                display: inline-block;
                margin: 0;
            }
            .pill input {
                position: absolute;
                opacity: 0;
                width: 1px;
                height: 1px;
                margin: 0;
            }
            .pill span {
                display: inline-block;
                padding: 8px 16px;
                border-radius: 999px;
                border: 2px solid var(--surface0);
                background: var(--base);
                font-weight: 700;
                cursor: pointer;
                user-select: none;
            }
            .pill:hover span {
                border-color: var(--surface1);
            }
            .pill input:checked + span {
                background: var(--mauve);
                border-color: var(--mauve);
                color: var(--base);
            }
            .pill input:focus-visible + span {
                outline: 3px solid var(--lavender);
                outline-offset: 2px;
            }

            button {
                font:
                    800 1rem Nunito,
                    sans-serif;
                border: 0;
                border-radius: 10px;
                padding: 12px 20px;
                cursor: pointer;
                background: var(--mauve);
                color: var(--base);
            }
            button:hover {
                filter: brightness(1.08);
            }
            button:focus-visible {
                outline: 3px solid var(--lavender);
                outline-offset: 2px;
            }
            button.ghost {
                background: var(--surface0);
                color: var(--text);
            }
            .actions {
                display: flex;
                gap: 10px;
                margin-top: 20px;
                flex-wrap: wrap;
            }
            #msg {
                min-height: 1.4em;
                margin: 14px 0 0;
                color: var(--red);
                font-weight: 700;
            }
            #result[hidden] {
                display: none;
            }
            #result {
                margin-top: 24px;
            }
            .meta {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
                margin-bottom: 10px;
            }
            .meta span {
                color: var(--sub);
            }
            .meta b {
                color: var(--green);
            }
            #out {
                font:
                    400 0.95rem/1.8 "JetBrains Mono",
                    monospace;
                background: var(--mantle);
                border: 1px solid var(--surface0);
                border-radius: 16px;
                padding: 16px;
                max-height: 55vh;
                overflow: auto;
                word-break: break-word;
                color: var(--text);
            }
            @media (max-width: 480px) {
                .row {
                    grid-template-columns: 1fr;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Number picker</h1>
            <p class="lead">
                Enter a start and an end, choose which numbers to draw from
                (all, even or odd) and how much of them to pick. You’ll get a
                sorted list of unique random numbers.
            </p>

            <div class="panel">
                <div class="row">
                    <div>
                        <label for="start">Start</label
                        ><input
                            id="start"
                            type="number"
                            step="1"
                            value="1"
                            inputmode="numeric"
                        />
                    </div>
                    <div>
                        <label for="end">End</label
                        ><input
                            id="end"
                            type="number"
                            step="1"
                            value="30"
                            inputmode="numeric"
                        />
                    </div>
                </div>

                <fieldset>
                    <legend>Numbers to pick from</legend>
                    <div class="pills">
                        <label class="pill"
                            ><input
                                type="radio"
                                name="parity"
                                value="all"
                                checked
                            /><span>All</span></label
                        >
                        <label class="pill"
                            ><input
                                type="radio"
                                name="parity"
                                value="even"
                            /><span>Even</span></label
                        >
                        <label class="pill"
                            ><input
                                type="radio"
                                name="parity"
                                value="odd"
                            /><span>Odd</span></label
                        >
                    </div>
                </fieldset>

                <fieldset>
                    <legend>How much of them</legend>
                    <div class="pills">
                        <label class="pill"
                            ><input
                                type="radio"
                                name="portion"
                                value="1/4"
                            /><span>A quarter</span></label
                        >
                        <label class="pill"
                            ><input
                                type="radio"
                                name="portion"
                                value="1/3"
                            /><span>A third</span></label
                        >
                        <label class="pill"
                            ><input
                                type="radio"
                                name="portion"
                                value="1/2"
                            /><span>Half</span></label
                        >
                        <label class="pill"
                            ><input
                                type="radio"
                                name="portion"
                                value="2/3"
                                checked
                            /><span>Two-thirds</span></label
                        >
                        <label class="pill"
                            ><input
                                type="radio"
                                name="portion"
                                value="1/1"
                            /><span>Whole</span></label
                        >
                    </div>
                </fieldset>

                <div class="actions">
                    <button id="go">Generate list</button>
                </div>
                <p id="msg" role="alert"></p>
            </div>

            <section id="result" hidden>
                <div class="meta">
                    <span
                        >Picked <b id="k"></b> of <b id="n"></b>
                        <span id="kind">values</span></span
                    >
                    <button class="ghost" id="copy">Copy list</button>
                </div>
                <div id="out"></div>
            </section>
        </main>
        <script>
            (function () {
                var MAX_RANGE = 1000000;
                var $ = function (id) {
                    return document.getElementById(id);
                };
                var last = "";

                function checked(name) {
                    return document.querySelector(
                        'input[name="' + name + '"]:checked',
                    ).value;
                }

                // Picks k unique values from the pool lo, lo+step, ... (n values).
                function sample(lo, step, n, k) {
                    var idx = [],
                        i,
                        j,
                        t;
                    if (k * 2 <= n) {
                        var seen = new Set();
                        while (seen.size < k)
                            seen.add(Math.floor(Math.random() * n));
                        idx = Array.from(seen);
                    } else {
                        var arr = new Array(n);
                        for (i = 0; i < n; i++) arr[i] = i;
                        for (i = 0; i < k; i++) {
                            j = i + Math.floor(Math.random() * (n - i));
                            t = arr[i];
                            arr[i] = arr[j];
                            arr[j] = t;
                        }
                        idx = arr.slice(0, k);
                    }
                    return idx
                        .map(function (x) {
                            return lo + x * step;
                        })
                        .sort(function (a, b) {
                            return a - b;
                        });
                }

                function run() {
                    var msg = $("msg");
                    msg.textContent = "";
                    var a = parseInt($("start").value, 10),
                        b = parseInt($("end").value, 10);
                    if (isNaN(a) || isNaN(b)) {
                        msg.textContent =
                            "Enter whole numbers for both start and end.";
                        return;
                    }
                    if (a > b) {
                        var s = a;
                        a = b;
                        b = s;
                    }
                    if (b - a + 1 > MAX_RANGE) {
                        msg.textContent =
                            "That range is too large. Keep it under 1,000,000 values.";
                        return;
                    }

                    var parity = checked("parity");
                    var lo = a,
                        step = 1;
                    if (parity !== "all") {
                        var want = parity === "even" ? 0 : 1;
                        step = 2;
                        if (((a % 2) + 2) % 2 !== want) lo = a + 1;
                    }
                    var n = lo > b ? 0 : Math.floor((b - lo) / step) + 1;
                    if (n < 1) {
                        msg.textContent =
                            "There are no " +
                            parity +
                            " numbers in that range. Widen it.";
                        return;
                    }

                    var frac = checked("portion").split("/");
                    var k = Math.round((n * +frac[0]) / +frac[1]);
                    if (k < 1) k = 1; // always pick at least one number
                    if (k > n) k = n;

                    var list = sample(lo, step, n, k);
                    last = list.join(", ");
                    $("out").textContent = last;
                    $("k").textContent = k.toLocaleString("en-IE");
                    $("n").textContent = n.toLocaleString("en-IE");
                    $("kind").textContent =
                        parity === "all" ? "values" : parity + " numbers";
                    $("result").hidden = false;
                }

                $("go").addEventListener("click", run);
                ["start", "end"].forEach(function (id) {
                    $(id).addEventListener("keydown", function (e) {
                        if (e.key === "Enter") run();
                    });
                });
                $("copy").addEventListener("click", function () {
                    var btn = $("copy");
                    function done() {
                        btn.textContent = "Copied";
                        setTimeout(function () {
                            btn.textContent = "Copy list";
                        }, 1500);
                    }
                    try {
                        navigator.clipboard
                            .writeText(last)
                            .then(done, fallback);
                    } catch (e) {
                        fallback();
                    }
                    function fallback() {
                        var r = document.createRange();
                        r.selectNodeContents($("out"));
                        var sel = window.getSelection();
                        sel.removeAllRanges();
                        sel.addRange(r);
                        try {
                            document.execCommand("copy");
                            done();
                        } catch (e) {}
                    }
                });
                run();
            })();
        </script>
    </body>
</html>

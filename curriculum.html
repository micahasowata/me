        <style>
            :root {
                --bg: #f4f1ea;
                --surface: #fbf9f4;
                --ink: #1a1a1a;
                --muted: #6b6b6b;
                --faint: #a3a3a3;
                --rule: #ddd6c8;
                --rule-strong: #b8ae99;
                --accent: #2d6f73;
                --accent-soft: #e6f0ee;
                --code: #b45309;
                --code-soft: #fef3e2;
                --math: #7c3aed;
                --math-soft: #f0ebfe;
                --gate-bg: #fef3c7;
                --gate-border: #f59e0b;
                --gate-ink: #78350f;
                --next: #b91c1c;
                --next-soft: #fef2f2;
                --serif: "Newsreader", Georgia, serif;
                --sans: "Public Sans", system-ui, sans-serif;
                --mono: "JetBrains Mono", ui-monospace, monospace;
                box-sizing: border-box;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0e1412;
                    --surface: #17201d;
                    --ink: #e8e8e0;
                    --muted: #8a9494;
                    --faint: #5a6565;
                    --rule: #263432;
                    --rule-strong: #3a4c4a;
                    --accent: #5bb3b3;
                    --accent-soft: #142624;
                    --code: #fbbf24;
                    --code-soft: #2a1f08;
                    --math: #a78bfa;
                    --math-soft: #1e1a35;
                    --gate-bg: #2a1f0a;
                    --gate-border: #b45309;
                    --gate-ink: #fbbf24;
                    --next: #f87171;
                    --next-soft: #2a1212;
                }
            }
            *,
            *::before,
            *::after {
                box-sizing: inherit;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font: 400 16px/1.55 var(--sans);
                -webkit-font-smoothing: antialiased;
            }

            .hero {
                position: sticky;
                top: 0;
                z-index: 100;
                padding: 1.15rem 1.25rem 0.85rem;
                background: var(--bg);
                border-bottom: 1px solid var(--rule);
                backdrop-filter: saturate(140%) blur(8px);
            }
            @media (min-width: 48rem) {
                .hero {
                    padding: 1.6rem max(1.25rem, calc(50vw - 24rem)) 1rem;
                }
            }
            .eyebrow {
                margin: 0 0 0.4rem;
                font: 600 0.7rem/1 var(--sans);
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--muted);
            }
            h1 {
                margin: 0 0 0.8rem;
                font: 700 clamp(1.7rem, 6vw, 2.7rem)/1.08 var(--serif);
                letter-spacing: -0.02em;
            }
            #count {
                font-variant-numeric: tabular-nums;
                display: inline-block;
                will-change: transform;
            }
            #count.pop {
                animation: pop 0.28s ease;
            }
            @keyframes pop {
                0% {
                    transform: scale(1);
                }
                45% {
                    transform: scale(1.12);
                }
                100% {
                    transform: scale(1);
                }
            }
            .lede {
                margin: 0 0 1rem;
                color: var(--muted);
                max-width: 40rem;
                font-size: 0.93rem;
            }
            .bar {
                height: 6px;
                background: var(--rule);
                border-radius: 3px;
                overflow: hidden;
                margin: 0 0 0.5rem;
            }
            .bar i {
                display: block;
                height: 100%;
                width: 0;
                background: linear-gradient(90deg, var(--accent), #4ea8a8);
                border-radius: 3px;
                transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            .meta {
                display: flex;
                justify-content: space-between;
                font-size: 0.8rem;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
                letter-spacing: 0.01em;
            }
            .meta b {
                color: var(--ink);
                font-weight: 600;
            }

            main {
                max-width: 48rem;
                margin: 0 auto;
                padding: 2rem 1.25rem 6rem;
            }
            .block {
                margin: 0 0 3.5rem;
            }
            .block-head {
                margin: 0 0 1rem;
                padding-bottom: 0.8rem;
                border-bottom: 2px solid var(--rule-strong);
            }
            .block-num {
                font: 500 0.72rem/1 var(--mono);
                color: var(--muted);
                letter-spacing: 0.08em;
                display: block;
                margin-bottom: 0.35rem;
            }
            .block-title {
                font: 700 clamp(1.4rem, 4.5vw, 1.9rem)/1.15 var(--serif);
                margin: 0;
                letter-spacing: -0.01em;
            }

            .phase-head {
                margin: 1.75rem 0 0.7rem;
                padding: 0.5rem 0.85rem;
                font: 600 0.78rem/1.2 var(--sans);
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--accent);
                border-left: 3px solid var(--accent);
                background: var(--accent-soft);
                border-radius: 0 6px 6px 0;
            }
            .phase-head:first-of-type {
                margin-top: 0.5rem;
            }

            .sessions {
                display: flex;
                flex-direction: column;
                gap: 1px;
                background: var(--rule);
                border: 1px solid var(--rule);
                border-radius: 10px;
                overflow: hidden;
            }
            .session {
                display: grid;
                grid-template-columns: 1.6rem 3.4rem 1.7rem 1fr;
                gap: 0.7rem;
                align-items: center;
                padding: 0.62rem 0.85rem;
                background: var(--surface);
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    opacity 0.2s ease;
                font-size: 0.92rem;
                line-height: 1.4;
                position: relative;
            }
            .session:hover {
                background: var(--accent-soft);
            }
            .session:focus-within {
                outline: 2px solid var(--accent);
                outline-offset: -2px;
            }
            .session input {
                appearance: none;
                -webkit-appearance: none;
                width: 1.35rem;
                height: 1.35rem;
                margin: 0;
                border: 2px solid var(--rule-strong);
                border-radius: 50%;
                background: var(--bg);
                cursor: pointer;
                transition:
                    background 0.15s,
                    border-color 0.15s;
                position: relative;
                flex-shrink: 0;
            }
            .session input:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }
            .session input:checked {
                background: var(--accent);
                border-color: var(--accent);
            }
            .session input:checked::after {
                content: "";
                position: absolute;
                inset: 0;
                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3.5 8.2l3 3 5.5-6.4' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
                background-size: 78%;
                background-position: center;
                background-repeat: no-repeat;
                animation: checkin 0.2s cubic-bezier(0.3, 1.6, 0.5, 1);
            }
            @keyframes checkin {
                from {
                    transform: scale(0.2);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }
            .session .num {
                font: 500 0.72rem/1 var(--mono);
                color: var(--muted);
                letter-spacing: 0.02em;
                font-variant-numeric: tabular-nums;
            }
            .session .strand {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 1.65rem;
                height: 1.65rem;
                border-radius: 6px;
                font-size: 0.88rem;
                line-height: 1;
            }
            .session.code .strand {
                background: var(--code-soft);
            }
            .session.math .strand {
                background: var(--math-soft);
            }
            .session .text {
                color: var(--ink);
                transition:
                    color 0.15s,
                    text-decoration-color 0.15s;
            }
            .session .text a {
                color: inherit;
                text-decoration: underline;
                text-decoration-color: var(--faint);
                text-underline-offset: 2px;
            }
            .session .text a:hover {
                text-decoration-color: var(--accent);
            }
            .session.done {
                opacity: 0.55;
            }
            .session.done .text {
                text-decoration: line-through;
                text-decoration-color: var(--faint);
                text-decoration-thickness: 1px;
            }
            .session.done .num {
                color: var(--faint);
            }
            .session.next {
                background: var(--next-soft);
            }
            .session.next::before {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 3px;
                background: var(--next);
            }
            .session.next .text {
                font-weight: 500;
            }
            .session.next .num {
                color: var(--next);
                font-weight: 600;
            }

            .gate {
                margin: 1.1rem 0 0;
                padding: 0.9rem 1.1rem;
                background: var(--gate-bg);
                border: 1px solid var(--gate-border);
                border-left-width: 4px;
                border-radius: 6px;
                color: var(--gate-ink);
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .gate .label {
                font: 700 0.72rem/1 var(--sans);
                letter-spacing: 0.12em;
                text-transform: uppercase;
                display: block;
                margin-bottom: 0.4rem;
            }
            .gate code {
                background: rgba(0, 0, 0, 0.08);
                padding: 0.05rem 0.3rem;
                border-radius: 3px;
                font-size: 0.85em;
            }

            footer {
                max-width: 48rem;
                margin: 0 auto;
                padding: 1.5rem 1.25rem 4rem;
                text-align: center;
            }
            footer button {
                font: 500 0.85rem var(--sans);
                color: var(--muted);
                background: none;
                border: 1px solid var(--rule-strong);
                border-radius: 6px;
                padding: 0.55rem 1.1rem;
                cursor: pointer;
                transition: all 0.15s;
            }
            footer button:hover {
                color: var(--ink);
                border-color: var(--ink);
            }
            footer button:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            body.all-done h1 {
                color: var(--accent);
            }

            @media (max-width: 30rem) {
                .session {
                    grid-template-columns: 1.35rem 2.9rem 1.55rem 1fr;
                    gap: 0.45rem;
                    padding: 0.58rem 0.7rem;
                    font-size: 0.87rem;
                }
                .session input {
                    width: 1.2rem;
                    height: 1.2rem;
                }
                .session .strand {
                    width: 1.5rem;
                    height: 1.5rem;
                    font-size: 0.8rem;
                }
            }
        </style>
    </head>

                                ],

                        },
                    ],
                },
            ];

            const TOTAL = DATA.reduce(
                (sum, b) =>
                    sum +
                    b.sections.reduce((s, sec) => s + sec.sessions.length, 0),
                0,
            );

            const KEY = "roadmap-458-v3";
            let state = {};
            try {
                state = JSON.parse(localStorage.getItem(KEY) || "{}") || {};
            } catch (e) {
                state = {};
            }

            const mainEl = document.getElementById("main");
            const countEl = document.getElementById("count");
            const suffixEl = document.getElementById("suffix");
            const pbarEl = document.getElementById("pbar");
            const metaEl = document.getElementById("meta");
            const pctEl = document.getElementById("meta-pct");
            const rowMap = new Map();

            DATA.forEach((block) => {
                const section = document.createElement("section");
                section.className = "block";

                const head = document.createElement("div");
                head.className = "block-head";
                head.innerHTML = `<span class="block-num">BLOCK ${block.n}</span>
                    <h2 class="block-title">${block.icon} ${block.title}</h2>`;
                section.appendChild(head);

                block.sections.forEach((sec) => {
                    if (sec.title) {
                        const ph = document.createElement("h3");
                        ph.className = "phase-head";
                        ph.textContent = sec.title;
                        section.appendChild(ph);
                    }

                    const list = document.createElement("div");
                    list.className = "sessions";

                    sec.sessions.forEach(([id, strand, text]) => {
                        const label = document.createElement("label");
                        label.className = "session " + strand;
                        label.dataset.id = id;

                        const input = document.createElement("input");
                        input.type = "checkbox";
                        input.checked = !!state[id];
                        input.setAttribute(
                            "aria-label",
                            `Session ${id}: ${text.replace(/<[^>]+>/g, "")}`,
                        );

                        const num = document.createElement("span");
                        num.className = "num";
                        num.textContent = id;

                        const strandEl = document.createElement("span");
                        strandEl.className = "strand";
                        strandEl.setAttribute("aria-hidden", "true");
                        strandEl.textContent = strand === "code" ? "💻" : "📐";

                        const txt = document.createElement("span");
                        txt.className = "text";
                        txt.innerHTML = text;

                        label.append(input, num, strandEl, txt);
                        if (state[id]) label.classList.add("done");

                        input.addEventListener("change", () => {
                            if (input.checked) {
                                state[id] = 1;
                                label.classList.add("done");
                            } else {
                                delete state[id];
                                label.classList.remove("done");
                            }
                            persist();
                            update();
                        });

                        txt.querySelectorAll("a").forEach((a) =>
                            a.addEventListener("click", (e) =>
                                e.stopPropagation(),
                            ),
                        );

                        list.appendChild(label);
                        rowMap.set(id, label);
                    });

                    section.appendChild(list);
                });

                if (block.gate) {
                    const gate = document.createElement("div");
                    gate.className = "gate";
                    gate.innerHTML = `<span class="label">🏆 Gate</span>${block.gate}`;
                    section.appendChild(gate);
                }

                mainEl.appendChild(section);
            });

            function persist() {
                try {
                    localStorage.setItem(KEY, JSON.stringify(state));
                } catch (e) {}
            }

            function update() {
                const done = Object.keys(state).length;
                const remaining = TOTAL - done;

                if (remaining === 0) {
                    countEl.textContent = "0";
                    suffixEl.textContent = "— finish line 🏁";
                    document.body.classList.add("all-done");
                } else {
                    countEl.textContent = remaining;
                    suffixEl.textContent =
                        remaining === 1 ? "session to go" : "sessions to go";
                    document.body.classList.remove("all-done");
                }

                countEl.classList.remove("pop");
                void countEl.offsetWidth;
                countEl.classList.add("pop");

                const pct = (done / TOTAL) * 100;
                pbarEl.style.width = pct + "%";
                metaEl.innerHTML = `<b>${done}</b> / ${TOTAL} complete`;
                pctEl.textContent = Math.round(pct) + "%";

                let nextId = null;
                outer: for (const block of DATA) {
                    for (const sec of block.sections) {
                        for (const [id] of sec.sessions) {
                            if (!state[id]) {
                                nextId = id;
                                break outer;
                            }
                        }
                    }
                }
                rowMap.forEach((el, id) =>
                    el.classList.toggle("next", id === nextId),
                );
            }

            document.getElementById("reset").addEventListener("click", () => {
                if (!confirm("Clear all ticks? This can't be undone.")) return;
                state = {};
                persist();
                rowMap.forEach((el) => {
                    el.classList.remove("done");
                    el.querySelector("input").checked = false;
                });
                update();
            });

            document.getElementById("meta").innerHTML =
                `<b>0</b> / ${TOTAL} complete`;
            document.getElementById("count").textContent = TOTAL;

            update();
        </script>

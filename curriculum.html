        <style>
            :root {
                --bg: #f4f1ea;
                --surface: #fbf9f4;
                --surface-2: #f0ece2;
                --ink: #1e2423;
                --muted: #6b6a63;
                --line: #d9d3c6;
                --teal: #2d6f73;
                --teal-soft: #dcebea;
                --amber: #a86414;
                --amber-bg: #f7ead1;
                --violet: #5f45a8;
                --violet-bg: #eee7fb;
                --red: #b23b3b;
                --red-bg: #f8e4e1;
                --shadow: 0 10px 30px rgba(42, 38, 30, 0.08);
                --radius: 16px;
                --font-heading: "Newsreader", Georgia, "Times New Roman", serif;
                --font-body:
                    "Public Sans", system-ui, -apple-system, BlinkMacSystemFont,
                    "Segoe UI", sans-serif;
                --font-mono:
                    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
                    Consolas, monospace;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0f1716;
                    --surface: #14201e;
                    --surface-2: #1a2926;
                    --ink: #e8e3d8;
                    --muted: #a6a095;
                    --line: #2a3835;
                    --teal: #7cc4c7;
                    --teal-soft: #1d3333;
                    --amber: #e0a94a;
                    --amber-bg: #3a2e1a;
                    --violet: #b9a0ff;
                    --violet-bg: #2a2440;
                    --red: #ff8a80;
                    --red-bg: #3a1f1f;
                    --shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
                }
            }

            * {
                box-sizing: border-box;
            }

            html {
                color-scheme: light dark;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: var(--font-body);
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
            }

            a {
                color: var(--teal);
                text-underline-offset: 2px;
            }

            .shell {
                width: min(70rem, 100%);
                margin: 0 auto;
                padding: 0 1rem;
            }

            .site-header {
                position: sticky;
                top: 0;
                z-index: 20;
                background: color-mix(in srgb, var(--bg) 92%, transparent);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--line);
                padding-top: calc(1rem + env(safe-area-inset-top));
                padding-bottom: 1rem;
            }

            .eyebrow {
                margin: 0 0 0.35rem;
                font-family: var(--font-mono);
                font-size: 0.72rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--muted);
            }

            h1 {
                margin: 0;
                font-family: var(--font-heading);
                font-weight: 700;
                font-size: clamp(2rem, 5vw, 3.6rem);
                line-height: 1.02;
                letter-spacing: -0.035em;
            }

            .count-line.pop {
                animation: pop 340ms ease;
            }

            @keyframes pop {
                0% {
                    transform: scale(1);
                }
                42% {
                    transform: scale(1.055);
                }
                100% {
                    transform: scale(1);
                }
            }

            .lede {
                max-width: 48rem;
                margin: 0.55rem 0 1rem;
                color: var(--muted);
                font-size: 1rem;
            }

            .progress-track {
                width: 100%;
                height: 0.72rem;
                background: var(--surface-2);
                border: 1px solid var(--line);
                border-radius: 999px;
                overflow: hidden;
            }

            .progress-bar {
                height: 100%;
                width: 0%;
                background: linear-gradient(
                    90deg,
                    var(--teal),
                    color-mix(in srgb, var(--teal) 60%, var(--amber))
                );
                border-radius: inherit;
                transition: width 220ms ease;
            }

            .progress-meta {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 1rem;
                margin-top: 0.55rem;
                font-family: var(--font-mono);
                font-size: 0.78rem;
                color: var(--muted);
            }

            main {
                padding: 2rem 0 1rem;
            }

            .block {
                margin-bottom: 2.8rem;
            }

            .block-header {
                display: flex;
                align-items: baseline;
                gap: 0.8rem;
                flex-wrap: wrap;
                padding-bottom: 0.85rem;
                border-bottom: 1px solid var(--line);
                margin-bottom: 1rem;
            }

            .block-kicker {
                font-family: var(--font-mono);
                font-size: 0.76rem;
                letter-spacing: 0.12em;
                color: var(--teal);
                text-transform: uppercase;
            }

            .block-title {
                margin: 0;
                font-family: var(--font-heading);
                font-weight: 700;
                font-size: clamp(1.45rem, 3.4vw, 2.15rem);
                line-height: 1.1;
                letter-spacing: -0.02em;
            }

            .phase-title {
                margin: 1.3rem 0 0.55rem;
                font-family: var(--font-mono);
                font-size: 0.78rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--muted);
            }

            .session-list {
                display: grid;
                gap: 0.35rem;
            }

            .row {
                display: grid;
                grid-template-columns: 1.5rem 3.8rem 2rem minmax(0, 1fr);
                gap: 0.7rem;
                align-items: start;
                padding: 0.7rem 0.8rem;
                border: 1px solid transparent;
                border-left: 1px solid transparent;
                border-radius: 12px;
                background: transparent;
                cursor: pointer;
                position: relative;
                transition:
                    background 160ms ease,
                    opacity 160ms ease,
                    border-color 160ms ease;
            }

            .row:hover {
                background: color-mix(in srgb, var(--surface) 75%, transparent);
            }

            .row:focus-within {
                outline: 3px solid var(--teal);
                outline-offset: 2px;
            }

            .row.done {
                opacity: 0.58;
            }

            .row.done .session-text {
                text-decoration: line-through;
                text-decoration-thickness: 1px;
            }

            .row.next {
                background: var(--red-bg);
                border-left: 4px solid var(--red);
                padding-left: calc(0.8rem - 3px);
            }

            .tick {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }

            .box {
                width: 1.2rem;
                height: 1.2rem;
                margin-top: 0.12rem;
                border: 2px solid var(--teal);
                border-radius: 50%;
                background: var(--surface);
                display: grid;
                place-items: center;
                transition:
                    background 160ms ease,
                    border-color 160ms ease,
                    transform 160ms ease;
            }

            .tick:checked + .box {
                background: var(--teal);
                border-color: var(--teal);
            }

            .tick:checked + .box::after {
                content: "";
                width: 0.33rem;
                height: 0.58rem;
                border: solid var(--bg);
                border-width: 0 2px 2px 0;
                transform: rotate(45deg) translateY(-0.05rem);
            }

            .sid {
                font-family: var(--font-mono);
                font-size: 0.78rem;
                color: var(--muted);
                padding-top: 0.1rem;
                white-space: nowrap;
            }

            .strand {
                width: 2rem;
                height: 2rem;
                border-radius: 0.5rem;
                display: grid;
                place-items: center;
                font-size: 1rem;
                line-height: 1;
            }

            .strand.code {
                background: var(--amber-bg);
            }
            .strand.math {
                background: var(--violet-bg);
            }

            .session-text {
                min-width: 0;
                font-size: 0.98rem;
                overflow-wrap: anywhere;
            }

            .gate {
                margin-top: 1.1rem;
                padding: 0.95rem 1rem;
                background: var(--amber-bg);
                border: 1px solid
                    color-mix(in srgb, var(--amber) 55%, var(--line));
                border-left: 5px solid var(--amber);
                border-radius: 12px;
                box-shadow: var(--shadow);
            }

            .gate strong {
                display: block;
                font-family: var(--font-mono);
                font-size: 0.76rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--amber);
                margin-bottom: 0.3rem;
            }

            .gate p {
                margin: 0;
                font-size: 0.95rem;
            }

            footer {
                border-top: 1px solid var(--line);
                padding-top: 1.25rem;
                padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
            }

            .footer-inner {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1rem;
                flex-wrap: wrap;
            }

            .footer-note {
                margin: 0;
                color: var(--muted);
                font-size: 0.85rem;
            }

            .clear {
                appearance: none;
                border: 1px solid var(--line);
                background: var(--surface);
                color: var(--ink);
                font: 600 0.86rem var(--font-body);
                padding: 0.65rem 0.95rem;
                border-radius: 999px;
                cursor: pointer;
                transition:
                    border-color 160ms ease,
                    background 160ms ease,
                    transform 160ms ease;
            }

            .clear:hover {
                border-color: var(--teal);
                background: var(--teal-soft);
            }

            .clear:focus-visible {
                outline: 3px solid var(--teal);
                outline-offset: 3px;
            }

            @media (max-width: 30rem) {
                .shell {
                    padding: 0 0.7rem;
                }
                h1 {
                    font-size: 2rem;
                }
                .lede {
                    font-size: 0.92rem;
                }
                .row {
                    grid-template-columns: 1.25rem 3.1rem 1.8rem minmax(0, 1fr);
                    gap: 0.45rem;
                    padding: 0.62rem 0.55rem;
                }
                .row.next {
                    padding-left: calc(0.55rem - 3px);
                }
                .strand {
                    width: 1.8rem;
                    height: 1.8rem;
                    font-size: 0.92rem;
                }
                .session-text {
                    font-size: 0.92rem;
                }
                .sid {
                    font-size: 0.72rem;
                }
                .progress-meta {
                    font-size: 0.72rem;
                }
            }
        </style>
    </head>

                </p>

                </div>
                <div class="progress-meta">

                    <span id="percent-meta">0%</span>
                </div>
            </div>
        </header>

        <main class="shell" id="main"></main>

            const STORAGE_KEY = "curriculum-6block-v1";
            const TOTAL = DATA.reduce((blockTotal, block) => {
                return (
                    blockTotal +
                    block.sections.reduce((sectionTotal, section) => {
                        return sectionTotal + section.sessions.length;
                    }, 0)
                );
            }, 0);

            function safeRead() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return {};
                    const parsed = JSON.parse(raw);
                    return parsed &&
                        typeof parsed === "object" &&
                        !Array.isArray(parsed)
                        ? parsed
                        : {};
                } catch {
                    return {};
                }
            }

            function safeWrite(value) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
                } catch {
                    // storage blocked or unavailable — the page still works without persistence
                }
            }

            let state = safeRead();
            let lastDone = null;

            const allIds = new Set();
            DATA.forEach((block) => {
                block.sections.forEach((section) => {
                    section.sessions.forEach(([id]) => allIds.add(id));
                });
            });

            function getDoneCount() {
                return Array.from(allIds).filter((id) => Boolean(state[id]))
                    .length;
            }

            function getNextId() {
                for (const block of DATA) {
                    for (const section of block.sections) {
                        for (const [id] of section.sessions) {
                            if (!state[id]) return id;
                        }
                    }
                }
                return null;
            }

            function emojiFor(strand) {
                return strand === "code" ? "💻" : "📐";
            }

            function render() {
                const main = document.getElementById("main");
                const nextId = getNextId();
                let html = "";

                DATA.forEach((block) => {
                    html += `<section class="block" aria-labelledby="block-${block.n}">`;
                    html += `<div class="block-header">`;
                    html += `<span class="block-kicker">BLOCK ${block.n}</span>`;
                    html += `<h2 class="block-title" id="block-${block.n}">${block.icon} ${block.title}</h2>`;
                    html += `</div>`;

                    block.sections.forEach((section) => {
                        if (section.title) {
                            html += `<h3 class="phase-title">${section.title}</h3>`;
                        }
                        html += `<div class="session-list">`;
                        section.sessions.forEach(([id, strand, text]) => {
                            const isDone = Boolean(state[id]);
                            const isNext = id === nextId;
                            const classes = [
                                "row",
                                isDone ? "done" : "",
                                isNext ? "next" : "",
                            ]
                                .filter(Boolean)
                                .join(" ");
                            html += `<label class="${classes}" data-id="${id}">`;
                            html += `<input class="tick" type="checkbox" data-id="${id}" ${isDone ? "checked" : ""} aria-label="Mark ${id} complete">`;
                            html += `<span class="box" aria-hidden="true"></span>`;
                            html += `<span class="sid">${id}</span>`;
                            html += `<span class="strand ${strand}" aria-hidden="true">${emojiFor(strand)}</span>`;
                            html += `<span class="session-text">${text}</span>`;
                            html += `</label>`;
                        });
                        html += `</div>`;
                    });

                    html += `<div class="gate"><strong>🏆 Gate</strong><p>${block.gate}</p></div>`;
                    html += `</section>`;
                });

                main.innerHTML = html;

                main.querySelectorAll(".row a").forEach((link) => {
                    link.addEventListener("click", (event) =>
                        event.stopPropagation(),
                    );
                });

                updateUI(false);
            }

            function updateUI(pop) {
                const done = getDoneCount();
                const remaining = TOTAL - done;
                const countLine = document.getElementById("count-line");
                const doneMeta = document.getElementById("done-meta");
                const percentMeta = document.getElementById("percent-meta");
                const progressBar = document.getElementById("progress-bar");

                countLine.textContent =
                    done === TOTAL
                        ? "0 — finish line 🏁"
                        : `${remaining} ${remaining === 1 ? "session" : "sessions"} to go`;

                doneMeta.textContent = `${done} / ${TOTAL} complete`;
                percentMeta.textContent = `${TOTAL === 0 ? 0 : Math.round((done / TOTAL) * 100)}%`;
                progressBar.style.width = `${TOTAL === 0 ? 0 : (done / TOTAL) * 100}%`;

                const nextId = getNextId();
                document.querySelectorAll(".row").forEach((row) => {
                    const id = row.dataset.id;
                    const isDone = Boolean(state[id]);
                    row.classList.toggle("done", isDone);
                    row.classList.toggle("next", id === nextId);
                    const checkbox = row.querySelector("input.tick");
                    if (checkbox) checkbox.checked = isDone;
                });

                if (pop && lastDone !== null && done !== lastDone) {
                    countLine.classList.remove("pop");
                    void countLine.offsetWidth;
                    countLine.classList.add("pop");
                    window.setTimeout(
                        () => countLine.classList.remove("pop"),
                        380,
                    );
                }

                lastDone = done;
            }

            document
                .getElementById("main")
                .addEventListener("change", (event) => {
                    const checkbox = event.target.closest("input.tick");
                    if (!checkbox) return;
                    const id = checkbox.dataset.id;
                    if (checkbox.checked) {
                        state[id] = true;
                    } else {
                        delete state[id];
                    }
                    safeWrite(state);
                    updateUI(true);
                });

            document
                .getElementById("clear-all")
                .addEventListener("click", () => {
                    const confirmed = window.confirm(
                        "Clear all ticks? This cannot be undone.",
                    );
                    if (!confirmed) return;
                    state = {};
                    safeWrite(state);
                    updateUI(true);
                });

            render();
        </script>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>micahasowata::curriculum</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Public+Sans:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #f2f5f4;
                --surface: #fff;
                --ink: #15262d;
                --muted: #53666d;
                --line: #2d6f73;
                --rule: #cfdad8;
                --acc: #4b3bb5;
                --accbg: #ecebfa;
                --done: #2d6f73;
                --ok: #e3f2ec;
                --warn: #fbf0dc;
                --bad: #fae6e6;
                --tip: #e6f0fa;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    color-scheme: dark;
                    --bg: #0e1a1d;
                    --surface: #15262a;
                    --ink: #e3ecea;
                    --muted: #9bb0b0;
                    --line: #5bb3b3;
                    --rule: #27403f;
                    --acc: #a99bff;
                    --accbg: #201e3d;
                    --done: #5bb3b3;
                    --ok: #16302a;
                    --warn: #33291a;
                    --bad: #3a1f21;
                    --tip: #18283a;
                }
            }
            :root[data-theme="dark"] {
                color-scheme: dark;
                --bg: #0e1a1d;
                --surface: #15262a;
                --ink: #e3ecea;
                --muted: #9bb0b0;
                --line: #5bb3b3;
                --rule: #27403f;
                --acc: #a99bff;
                --accbg: #201e3d;
                --done: #5bb3b3;
                --ok: #16302a;
                --warn: #33291a;
                --bad: #3a1f21;
                --tip: #18283a;
            }
            html {
                scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 7rem);
                height: 100%;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font:
                    400 16px/1.55 "Public Sans",
                    system-ui,
                    sans-serif;
            }
            main {
                max-width: 46rem;
                margin: 0 auto;
                padding: 2.5rem 1.25rem 4rem;
            }
            h1 {
                font:
                    700 clamp(2rem, 6vw, 3rem)/1.1 "Newsreader",
                    Georgia,
                    serif;
                margin: 0 0 0.75rem;
                letter-spacing: -0.01em;
            }
            .lede {
                color: var(--muted);
                max-width: 38rem;
                margin: 0 0 1.25rem;
            }
            .tabs {
                display: flex;
                gap: 0.5rem;
                margin: 0 0 1.25rem;
            }
            .tabs button {
                font: inherit;
                font-weight: 600;
                background: var(--surface);
                color: var(--muted);
                border: 1px solid var(--rule);
                border-radius: 6px;
                padding: 0.45rem 0.9rem;
                cursor: pointer;
            }
            .tabs button[aria-selected="true"] {
                background: var(--acc);
                color: #fff;
                border-color: var(--acc);
            }
            :root[data-theme="dark"] .tabs button[aria-selected="true"],
            :root:not([data-theme="light"]) .tabs button[aria-selected="true"] {
                color: #15162b;
            }
            button:focus-visible,
            input:focus-visible,
            summary:focus-visible,
            a:focus-visible {
                outline: 3px solid var(--acc);
                outline-offset: 2px;
            }
            .glance {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
                margin: 0 0 1.25rem;
            }
            .glance span {
                background: var(--surface);
                border: 1px solid var(--rule);
                border-radius: 4px;
                padding: 0.15rem 0.55rem;
                font-size: 0.9rem;
            }
            .progress {
                position: sticky;
                top: env(safe-area-inset-top, 0px);
                z-index: 5;
                background: var(--bg);
                padding: 0.6rem 0;
                border-bottom: 1px solid var(--rule);
                margin-bottom: 1.5rem;
            }
            .progress p {
                margin: 0 0 0.35rem;
                font-size: 0.9rem;
                color: var(--muted);
            }
            .bar {
                height: 6px;
                background: var(--rule);
                border-radius: 3px;
                overflow: hidden;
            }
            .bar i {
                display: block;
                height: 100%;
                width: 0;
                background: var(--done);
                transition: width 0.25s;
            }
            details {
                margin: 0 0 1.5rem;
                border: 1px solid var(--rule);
                border-radius: 6px;
                background: var(--surface);
            }
            details summary {
                cursor: pointer;
                padding: 0.7rem 1rem;
                font-weight: 600;
            }
            .scroll {
                overflow-x: auto;
                padding: 0 1rem 1rem;
            }
            table {
                border-collapse: collapse;
                width: 100%;
                font-size: 0.93rem;
            }
            th,
            td {
                text-align: left;
                padding: 0.35rem 0.6rem;
                border-bottom: 1px solid var(--rule);
                vertical-align: top;
            }
            th {
                color: var(--muted);
                font-weight: 600;
            }
            ol.track {
                list-style: none;
                margin: 0;
                padding: 0 0 0 2.2rem;
                position: relative;
            }
            ol.track::before {
                content: "";
                position: absolute;
                left: 0.7rem;
                top: 0.5rem;
                bottom: 0.5rem;
                width: 3px;
                background: var(--line);
                opacity: 0.45;
            }
            .item {
                position: relative;
                margin: 0 0 1.25rem;
            }
            .node {
                position: absolute;
                left: -2.2rem;
                top: 0.95rem;
                width: 1.5rem;
                height: 1.5rem;
                border-radius: 50%;
                border: 3px solid var(--line);
                background: var(--bg);
            }
            .item.done .node {
                background: var(--done);
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--rule);
                border-radius: 8px;
                padding: 1rem 1.1rem;
            }
            .card h2 {
                font:
                    700 1.35rem/1.2 "Newsreader",
                    Georgia,
                    serif;
                margin: 0 0 0.3rem;
            }
            .card h2 small {
                font:
                    500 0.85rem "Public Sans",
                    sans-serif;
                color: var(--acc);
                margin-left: 0.4rem;
                white-space: nowrap;
            }
            .meta {
                margin: 0 0 0.7rem;
                color: var(--muted);
                font-size: 0.92rem;
            }
            .res {
                margin: 0 0 0.7rem;
                font-size: 0.92rem;
            }
            .res a {
                color: var(--acc);
            }
            .card h3 {
                font:
                    600 0.8rem/1.3 "Public Sans",
                    sans-serif;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--muted);
                margin: 0.8rem 0 0.3rem;
            }
            ul.chk {
                list-style: none;
                margin: 0;
                padding: 0;
            }
            ul.chk label {
                display: flex;
                gap: 0.6rem;
                align-items: flex-start;
                padding: 0.2rem 0;
                cursor: pointer;
            }
            ul.chk input {
                appearance: none;
                -webkit-appearance: none;
                margin: 0.2rem 0 0;
                flex: none;
                width: 1.1rem;
                height: 1.1rem;
                border-radius: 4px;
                border: 2px solid var(--line);
                background: var(--bg);
                cursor: pointer;
            }
            ul.chk input:checked {
                background: var(--done);
            }
            ul.chk input:checked + span {
                color: var(--muted);
                text-decoration: line-through;
            }
            ul.chk em {
                color: var(--muted);
                font-style: italic;
            }
            .co {
                margin: 0.7rem 0 0;
                padding: 0.6rem 0.8rem;
                border-radius: 6px;
                border-left: 4px solid;
                font-size: 0.93rem;
            }
            .co b {
                display: block;
                font-size: 0.78rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }
            .co.ok {
                background: var(--ok);
                border-color: var(--done);
            }
            .co.warn {
                background: var(--warn);
                border-color: #c28a1e;
            }
            .co.bad {
                background: var(--bad);
                border-color: #c04a4a;
            }
            .co.tip {
                background: var(--tip);
                border-color: #3b7bc0;
            }
            .sec {
                margin-top: 2.5rem;
                border-top: 1px solid var(--rule);
                padding-top: 1.25rem;
            }
            .sec h2 {
                font:
                    700 1.4rem "Newsreader",
                    Georgia,
                    serif;
                margin: 0 0 0.5rem;
            }
            .sec ul.plain {
                margin: 0;
                padding-left: 1.2rem;
            }
            .sec li {
                margin: 0.3rem 0;
            }
            button.reset {
                margin-top: 1.5rem;
                font: inherit;
                background: none;
                color: var(--muted);
                border: 1px solid var(--rule);
                border-radius: 6px;
                padding: 0.4rem 0.8rem;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <h1 id="t"></h1>

            <div class="progress" aria-live="polite">

                <div class="bar"><i id="pbar"></i></div>
            </div>
            <details id="bk">
                <summary id="bks"></summary>
                <div class="scroll" id="bkt"></div>
            </details>
            <ol class="track" id="track"></ol>
            <div id="extra"></div>
            <button class="reset" id="reset" type="button">
                Clear ticks for this plan
            </button>
        </main>

            var cur = "math",
                st = {},
                KEY = "plans-v1";
            try {
                st = JSON.parse(localStorage.getItem(KEY) || "{}");
            } catch (e) {
                st = {};
            }
            function save() {
                try {
                    localStorage.setItem(KEY, JSON.stringify(st));
                } catch (e) {}
            }
            function $(i) {
                return document.getElementById(i);
            }
            function render() {
                var p = P[cur];
                document.title = p.title.replace(/&amp;/g, "&");
                $("t").innerHTML = p.title;
                $("lede").textContent = p.lede.replace(/&amp;/g, "&");
                $("tab-math").setAttribute("aria-selected", cur == "math");
                $("tab-cs").setAttribute("aria-selected", cur == "cs");
                $("glance").innerHTML = p.glance
                    .map(function (g) {
                        return "<span>" + g + "</span>";
                    })
                    .join("");
                $("bks").textContent = p.bks;
                $("bkt").innerHTML =
                    "<table><thead><tr>" +
                    p.bcols
                        .map(function (c) {
                            return "<th>" + c + "</th>";
                        })
                        .join("") +
                    "</tr></thead><tbody>" +
                    p.books
                        .map(function (r) {
                            return (
                                "<tr>" +
                                r
                                    .map(function (c) {
                                        return "<td>" + c + "</td>";
                                    })
                                    .join("") +
                                "</tr>"
                            );
                        })
                        .join("") +
                    "</tbody></table>";
                var h = "";
                p.phases.forEach(function (ph, i) {
                    h +=
                        '<li class="item" id="ph' +
                        i +
                        '"><div class="node"></div><section class="card"><h2>Phase ' +
                        (i + 1) +
                        ": " +
                        ph.t +
                        "<small>" +
                        ph.time +
                        "</small></h2>";
                    if (ph.core) h += '<p class="meta">' + ph.core + "</p>";
                    if (ph.res)
                        h +=
                            '<p class="res">' +
                            ph.res
                                .map(function (r) {
                                    return (
                                        '<a href="' +
                                        r[1] +
                                        '" target="_blank" rel="noopener">' +
                                        r[0] +
                                        "</a>"
                                    );
                                })
                                .join(" · ") +
                            "</p>";
                    ph.g.forEach(function (g, j) {
                        h += "<h3>" + g[0] + '</h3><ul class="chk">';
                        g[1].forEach(function (it, k) {
                            var s = it.split("|"),
                                id = cur + i + "-" + j + "-" + k;
                            h +=
                                '<li><label><input type="checkbox" data-id="' +
                                id +
                                '"' +
                                (st[id] ? " checked" : "") +
                                "><span>" +
                                s[0] +
                                (s[1] ? " <em>(" + s[1] + ")</em>" : "") +
                                "</span></label></li>";
                        });
                        h += "</ul>";
                    });
                    ph.c.forEach(function (c) {
                        h +=
                            '<div class="co ' +
                            c[0] +
                            '"><b>' +
                            c[1] +
                            "</b>" +
                            c[2] +
                            "</div>";
                    });
                    h += "</section></li>";
                });
                $("track").innerHTML = h;
                $("extra").innerHTML = p.extra
                    .map(function (e, x) {
                        return (
                            '<section class="sec"><h2>' +
                            e[0] +
                            "</h2>" +
                            (e[2]
                                ? '<ul class="chk">' +
                                  e[1]
                                      .map(function (t, k) {
                                          var id = cur + "x" + x + "-" + k;
                                          return (
                                              '<li><label><input type="checkbox" data-id="' +
                                              id +
                                              '"' +
                                              (st[id] ? " checked" : "") +
                                              "><span>" +
                                              t +
                                              "</span></label></li>"
                                          );
                                      })
                                      .join("") +
                                  "</ul>"
                                : '<ul class="plain">' +
                                  e[1]
                                      .map(function (t) {
                                          return "<li>" + t + "</li>";
                                      })
                                      .join("") +
                                  "</ul>") +
                            "</section>"
                        );
                    })
                    .join("");
                update();
            }
            function update() {
                var all = document.querySelectorAll(
                        "#track input,#extra input",
                    ),
                    n = 0;
                all.forEach(function (c) {
                    if (c.checked) n++;
                });
                $("ptext").textContent =
                    n + " of " + all.length + " items done";
                $("pbar").style.width =
                    (all.length ? (100 * n) / all.length : 0) + "%";
                P[cur].phases.forEach(function (_, i) {
                    var b = document.querySelectorAll("#ph" + i + " input"),
                        d = 0;
                    b.forEach(function (c) {
                        if (c.checked) d++;
                    });
                    $("ph" + i).classList.toggle(
                        "done",
                        b.length > 0 && d == b.length,
                    );
                });
            }
            document.addEventListener("change", function (e) {
                var c = e.target;
                if (c.dataset && c.dataset.id) {
                    if (c.checked) st[c.dataset.id] = 1;
                    else delete st[c.dataset.id];
                    save();
                    update();
                }
            });
            function go(k) {
                cur = k;
                try {
                    history.replaceState(null, "", "#" + k);
                } catch (e) {}
                render();
            }
            $("tab-math").onclick = function () {
                go("math");
            };
            $("tab-cs").onclick = function () {
                go("cs");
            };
            $("reset").onclick = function () {
                Object.keys(st).forEach(function (k) {
                    if (k.indexOf(cur) == 0) delete st[k];
                });
                save();
                render();
            };
            window.addEventListener("hashchange", function () {
                var h = location.hash.slice(1);
                if (P[h] && h != cur) {
                    cur = h;
                    render();
                }
            });
            if (P[location.hash.slice(1)]) cur = location.hash.slice(1);
            render();
        </script>
